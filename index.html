<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>孕期记录日历</title>
<style>
:root{
  --bg:#FFF6F8; --bg2:#FFEFF4; --card:#FFFFFF;
  --p50:#FFF5F8; --p100:#FFE7EF; --p200:#FFCEDD; --p300:#FFB0CA; --p400:#FF8FB6;
  --p500:#F76C9C; --p600:#EA4E85; --p700:#CE2F66; --p800:#9E1B49;
  --ink:#5C3341; --soft:#9B7484; --line:#FFE1EA;
  --t1:#F6B49B; --t2:#F58BAF; --t3:#E75480;
  --shadow:0 10px 30px -12px rgba(214,74,120,.28);
  --shadow-lg:0 22px 60px -22px rgba(190,50,100,.42);
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:"PingFang SC","HarmonyOS Sans SC","Microsoft YaHei","Hiragino Sans GB",system-ui,-apple-system,sans-serif;
  color:var(--ink); background:var(--bg); min-height:100vh;
  background-image:
    radial-gradient(1100px 520px at 12% -8%, #FFE0EA 0%, transparent 62%),
    radial-gradient(900px 480px at 96% 4%, #FFF0DC 0%, transparent 58%),
    radial-gradient(800px 600px at 50% 110%, #FFEAF3 0%, transparent 60%);
  background-attachment:fixed;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:1240px;margin:0 auto;padding:26px 20px 60px}

.hero{
  position:relative;overflow:hidden;border-radius:28px;padding:26px 28px 22px;color:#fff;
  background:linear-gradient(135deg,#FFB3C9 0%,#F87FAC 46%,#E8578C 100%);
  box-shadow:var(--shadow-lg);
}
.hero::after{
  content:"";position:absolute;right:-70px;top:-90px;width:320px;height:320px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.34),transparent 66%);
}
.hero::before{
  content:"";position:absolute;left:-60px;bottom:-120px;width:260px;height:260px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.2),transparent 66%);
}
.hero-top{display:flex;flex-wrap:wrap;gap:22px;justify-content:space-between;align-items:flex-start;position:relative;z-index:2}
.pill-title{
  display:inline-flex;align-items:center;gap:7px;background:rgba(255,255,255,.24);
  border:1px solid rgba(255,255,255,.4);padding:4px 13px;border-radius:999px;
  font-size:12.5px;letter-spacing:.14em;font-weight:600;backdrop-filter:blur(4px);
}
.ga-big{font-size:44px;font-weight:800;letter-spacing:-.5px;margin:10px 0 4px;line-height:1.1}
.ga-big em{font-style:normal;font-size:20px;font-weight:600;opacity:.9;margin:0 2px}
.ga-sub{font-size:14px;opacity:.94;font-weight:500}
.hero-stats{display:flex;gap:10px;flex-wrap:wrap}
.stat{background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.34);border-radius:18px;padding:11px 16px;min-width:104px;backdrop-filter:blur(6px)}
.stat b{display:block;font-size:21px;font-weight:800;letter-spacing:-.3px}
.stat span{font-size:11.5px;opacity:.9}
.lmp-field{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.34);border-radius:14px;padding:9px 14px;backdrop-filter:blur(6px)}
.lmp-field input{
  border:none;background:transparent;color:#fff;font:inherit;font-weight:700;
  font-size:13px;outline:none;color-scheme:light
}
.lmp-field input::-webkit-calendar-picker-indicator{filter:invert(1) brightness(1.6);cursor:pointer}

.prog-wrap{margin-top:20px;position:relative;z-index:2}
.prog-labels{display:flex;justify-content:space-between;font-size:11.5px;font-weight:600;opacity:.92;margin-bottom:6px}
.prog{position:relative;height:13px;border-radius:999px;background:rgba(255,255,255,.3);overflow:visible}
.prog-fill{position:absolute;inset:0 auto 0 0;border-radius:999px;background:linear-gradient(90deg,#FFE9B8,#FFD3E1,#fff)}
.prog-zones{position:absolute;inset:0;border-radius:999px;overflow:hidden;display:flex;opacity:.55}
.prog-zones i{display:block;height:100%}
.prog-pin{
  position:absolute;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;
  background:#fff;border:4px solid var(--p600);box-shadow:0 4px 12px rgba(120,20,60,.35);
  transition:left .4s cubic-bezier(.4,1.3,.5,1)
}
.prog-pin::after{content:"";position:absolute;inset:5px;border-radius:50%;background:var(--p500)}

.layout{display:grid;grid-template-columns:minmax(0,1fr) 336px;gap:20px;margin-top:20px;align-items:start}
.card{background:var(--card);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:17px 20px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.card-h h2{font-size:15.5px;font-weight:800;letter-spacing:.02em}
.card-h .tag{font-size:11.5px;font-weight:700;color:var(--p700);background:var(--p100);padding:3px 10px;border-radius:999px}

.nav{display:flex;align-items:center;gap:6px}
.nav button{
  border:1px solid var(--line);background:var(--p50);color:var(--p700);width:32px;height:32px;border-radius:11px;
  font-size:14px;cursor:pointer;transition:.18s;display:grid;place-items:center
}
.nav button:hover{background:var(--p100);transform:translateY(-1px)}
.nav .today{
  width:auto;padding:0 13px;font-size:12.5px;font-weight:700
}
.cal-title{font-size:17px;font-weight:800;min-width:132px;text-align:center;letter-spacing:.02em}
.cal-title small{display:block;font-size:11.5px;color:var(--soft);font-weight:600;letter-spacing:0}

.weekdays{display:grid;grid-template-columns:repeat(7,1fr);gap:7px;padding:14px 16px 8px}
.weekdays span{text-align:center;font-size:11.5px;font-weight:700;color:var(--soft);letter-spacing:.08em}
.weekdays span:first-child,.weekdays span:last-child{color:var(--p400)}

.cal-body{display:grid;grid-template-columns:repeat(7,1fr);gap:7px;padding:0 16px 16px}
.cell{
  position:relative;min-height:92px;border-radius:16px;border:1px solid var(--line);background:var(--p50);
  padding:7px 8px 6px;cursor:pointer;transition:.16s;display:flex;flex-direction:column;gap:2px;overflow:hidden
}
.cell:hover{transform:translateY(-2px);box-shadow:0 8px 18px -8px rgba(214,74,120,.35);border-color:var(--p300)}
.cell.blank{background:transparent;border-color:transparent;cursor:default;pointer-events:none}
.cell.t1{background:linear-gradient(160deg,#FFF6F0,#FFEFE6);border-color:#FBDCCB}
.cell.t2{background:linear-gradient(160deg,#FFF4F8,#FFE8F1);border-color:#FBD8E7}
.cell.t3{background:linear-gradient(160deg,#FFEDF3,#FFE0EB);border-color:#F7C6D9}
.cell.pre{background:#FBFBFC;border-color:#F0EFF1}
.cell.post{background:#F7F6F8;border-color:#EEEBEF}
.cell.today{border:2px solid var(--p500);box-shadow:0 0 0 3px rgba(247,108,156,.18)}
.cell.sel{outline:2px dashed var(--p500);outline-offset:-3px}

.cell .d{font-size:16px;font-weight:800;line-height:1.1;letter-spacing:-.3px}
.cell .ga{font-size:10.5px;font-weight:700;color:var(--soft);letter-spacing:-.2px}
.cell.pre .d,.cell.pre .ga{color:#BFB8BF}
.cell.post .d,.cell.post .ga{color:#A79AA6}
.wk{
  position:absolute;right:6px;top:6px;font-size:9.5px;font-weight:800;color:#fff;
  background:linear-gradient(135deg,var(--p400),var(--p600));padding:2px 6px;border-radius:8px;
  letter-spacing:-.2px;box-shadow:0 2px 6px -2px rgba(200,60,110,.6)
}
.dot{position:absolute;left:8px;bottom:7px;width:7px;height:7px;border-radius:50%;background:var(--p500);box-shadow:0 0 0 2.5px rgba(255,255,255,.9)}
.cu{
  margin-top:auto;font-size:10px;font-weight:800;color:#fff;border-radius:8px;padding:3px 5px;
  background:linear-gradient(135deg,var(--t1),var(--p500));letter-spacing:-.3px;
  box-shadow:0 3px 8px -3px rgba(200,60,110,.7)
}
.cu.t1{background:linear-gradient(135deg,#F8B99E,#EF8E6E)}
.cu.t2{background:linear-gradient(135deg,#F795B8,#EA5C93)}
.cu.t3{background:linear-gradient(135deg,#EE6E93,#C92E64)}

.legend{display:flex;flex-wrap:wrap;gap:8px 16px;padding:14px 20px 18px;border-top:1px solid var(--line);font-size:11.5px;font-weight:600;color:var(--soft)}
.legend i{display:inline-block;width:11px;height:11px;border-radius:4px;margin-right:6px;vertical-align:-1px;border:1px solid rgba(0,0,0,.05)}

.side{display:flex;flex-direction:column;gap:20px}
.cu-list{padding:8px 12px 14px;max-height:560px;overflow:auto}
.cu-item{display:flex;gap:10px;padding:10px;border-radius:15px;transition:.16s;cursor:pointer;align-items:flex-start}
.cu-item:hover{background:var(--p50)}
.cu-item.done{opacity:.55}
.cu-box{
  flex:none;width:20px;height:20px;border-radius:7px;border:2px solid var(--p300);background:#fff;
  display:grid;place-items:center;cursor:pointer;transition:.16s;margin-top:2px
}
.cu-box.on{background:linear-gradient(135deg,var(--p400),var(--p600));border-color:var(--p600)}
.cu-box.on::after{content:"";width:9px;height:5px;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(-45deg) translate(1px,-1px)}
.cu-main{flex:1;min-width:0}
.cu-name{font-size:13px;font-weight:800;letter-spacing:-.2px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.cu-date{font-size:11px;color:var(--soft);font-weight:600;margin-top:1px}
.cu-items{font-size:11.5px;color:var(--soft);line-height:1.75;margin-top:6px;display:none;padding-left:2px}
.cu-item.open .cu-items{display:block}
.cu-item.open{background:var(--p50)}
.badge-week{font-size:10px;font-weight:800;background:var(--p100);color:var(--p700);padding:2px 7px;border-radius:7px;white-space:nowrap}
.cu-item.past .cu-name{color:var(--soft)}
.cu-flag{font-size:10.5px;font-weight:800;padding:2px 7px;border-radius:7px;background:var(--p100);color:var(--p700)}
.cu-flag.soon{background:#FFE7C7;color:#A75B0B}
.cu-flag.next{background:linear-gradient(135deg,var(--p400),var(--p600));color:#fff}

.tips{padding:16px 20px 20px}
.tips h3{font-size:14.5px;font-weight:800;display:flex;align-items:center;gap:8px;margin-bottom:4px}
.tips h3 span{font-size:11px;font-weight:800;background:linear-gradient(135deg,var(--t1),var(--p500));color:#fff;padding:2px 8px;border-radius:8px}
.tips p{font-size:12px;color:var(--soft);line-height:1.7;margin-top:6px}
.tips ul{list-style:none;margin-top:10px;display:flex;flex-direction:column;gap:7px}
.tips li{font-size:12.5px;line-height:1.6;padding-left:20px;position:relative;color:var(--ink)}
.tips li::before{content:"";position:absolute;left:4px;top:6px;width:7px;height:7px;border-radius:50%;background:var(--p300)}
.tips li b{font-weight:800}
.tips .next-up{margin-top:14px;padding:12px 14px;border-radius:16px;background:linear-gradient(135deg,var(--p50),var(--p100));border:1px dashed var(--p200)}
.tips .next-up b{font-size:12.5px;font-weight:800;color:var(--p700)}
.tips .next-up span{display:block;font-size:11.5px;color:var(--soft);font-weight:600;margin-top:2px}

.overlay{position:fixed;inset:0;background:rgba(92,51,65,.42);backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;padding:20px;z-index:50}
.overlay.on{display:flex}
.modal{
  width:100%;max-width:440px;background:#fff;border-radius:26px;box-shadow:var(--shadow-lg);
  overflow:hidden;animation:pop .22s cubic-bezier(.3,1.4,.5,1)
}
@keyframes pop{from{transform:translateY(14px) scale(.97);opacity:0}}
.modal-h{padding:20px 22px 16px;background:linear-gradient(135deg,#FFD3E0,#FFE9F0)}
.modal-h .close{position:absolute;right:16px;top:14px;border:none;background:rgba(255,255,255,.7);width:28px;height:28px;border-radius:9px;cursor:pointer;color:var(--p700);font-size:15px}
.modal-h h3{font-size:17px;font-weight:800}
.modal-h p{font-size:12px;color:var(--p700);font-weight:700;margin-top:3px}
.modal-b{padding:18px 22px 22px}
.note{display:flex;gap:10px;padding:10px 0;border-bottom:1px dashed var(--line)}
.note:last-child{border-bottom:none}
.note-t{flex:1;font-size:13px;line-height:1.6;word-break:break-word}
.note-t small{display:block;font-size:10.5px;color:var(--soft);font-weight:600;margin-top:3px}
.tagchip{font-size:10px;font-weight:800;padding:2px 7px;border-radius:7px;background:var(--p100);color:var(--p700);height:fit-content;margin-top:2px}
.tagchip.身体{background:#FFE4D6;color:#B4551F}
.tagchip.心情{background:#FFE9F4;color:#C0367E}
.tagchip.饮食{background:#E2F3E4;color:#2F7D46}
.tagchip.待办{background:#E6ECFB;color:#3B5BB5}
.note-del{border:none;background:transparent;color:#D9C2CB;cursor:pointer;font-size:15px;padding:0 2px;align-self:center}
.note-del:hover{color:var(--p600)}
.empty{font-size:12.5px;color:#C3AFB9;text-align:center;padding:14px 0}
.add{display:flex;flex-direction:column;gap:9px;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.add textarea{
  border:1px solid var(--line);border-radius:14px;padding:11px 13px;font:inherit;font-size:13px;
  resize:vertical;min-height:70px;outline:none;background:var(--p50);color:var(--ink)
}
.add textarea:focus{border-color:var(--p300);background:#fff}
.add-row{display:flex;gap:8px}
.add-row select{flex:1;border:1px solid var(--line);border-radius:12px;padding:9px 10px;font:inherit;font-size:12.5px;font-weight:600;color:var(--p700);background:var(--p50);outline:none;cursor:pointer}
.btn{border:none;border-radius:12px;padding:9px 20px;font:inherit;font-size:13px;font-weight:800;cursor:pointer;background:linear-gradient(135deg,var(--p400),var(--p600));color:#fff;box-shadow:0 6px 14px -6px rgba(200,60,110,.8);transition:.16s}
.btn:hover{transform:translateY(-1px);box-shadow:0 9px 18px -7px rgba(200,60,110,.9)}
.foot{text-align:center;font-size:11px;color:#C9B2BD;margin-top:22px;line-height:1.8}

.go-today{
  position:fixed;right:20px;bottom:24px;z-index:40;border:none;cursor:pointer;
  border-radius:999px;padding:12px 20px;font-size:13.5px;font-weight:800;color:#fff;letter-spacing:.02em;
  background:linear-gradient(135deg,#FFA8C4,#E5477F);box-shadow:0 12px 26px -10px rgba(200,50,110,.65);
  transition:.18s;font-family:inherit
}
.go-today:hover{transform:translateY(-2px) scale(1.03)}
.nav .today.pulse{animation:pulse .6s ease 2}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(247,108,156,.55)}50%{box-shadow:0 0 0 9px rgba(247,108,156,0)}}

@media (max-width:980px){
  .layout{grid-template-columns:1fr}
  .ga-big{font-size:36px}
}
@media (max-width:560px){
  .wrap{padding:14px 12px 40px}
  .hero{padding:20px 18px 18px;border-radius:22px}
  .hero-stats{width:100%}
  .stat{flex:1;min-width:88px}
  .cell{min-height:74px;padding:5px 6px}
  .cell .d{font-size:14px}
  .wk{font-size:8.5px;padding:1px 4px;right:4px;top:4px}
  .cu{font-size:9px;padding:2px 3px}
  .cal-body,.weekdays{gap:5px;padding-left:10px;padding-right:10px}
}
</style>
</head>
<body>
<div class="wrap">

  <header class="hero">
    <div class="hero-top">
      <div>
        <div class="pill-title">🌸 孕期记录</div>
        <div class="ga-big" id="gaBig">—</div>
        <div class="ga-sub" id="gaSub">—</div>
      </div>
      <div class="hero-stats" id="stats"></div>
      <label class="lmp-field">末次月经
        <input type="date" id="lmpInput">
      </label>
    </div>
    <div class="prog-wrap">
      <div class="prog-labels"><span>0 周</span><span>孕早期 0–13</span><span>孕中期 14–27</span><span>孕晚期 28–40</span><span>40 周</span></div>
      <div class="prog" id="prog"><div class="prog-zones"><i style="flex:35"></i><i style="flex:35"></i><i style="flex:30"></i></div><div class="prog-fill" id="progFill"></div><div class="prog-pin" id="progPin"></div></div>
    </div>
  </header>

  <div class="layout">
    <section class="card">
      <div class="card-h">
        <div class="cal-title" id="calTitle">—<small id="calSub">—</small></div>
        <div class="nav">
          <button id="prevBtn" title="上个月">‹</button>
          <button class="today" id="todayBtn" title="回到今天">回到今天</button>
          <button id="nextBtn" title="下个月">›</button>
        </div>
      </div>
      <div class="weekdays"><span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span></div>
      <div class="cal-body" id="calBody"></div>
      <div class="legend">
        <span><i style="background:#FFF6F0;border-color:#FBDCCB"></i>孕早期 0–13 周</span>
        <span><i style="background:#FFF4F8;border-color:#FBD8E7"></i>孕中期 14–27 周</span>
        <span><i style="background:#FFEDF3;border-color:#F7C6D9"></i>孕晚期 28–40 周</span>
        <span><i style="background:#fff;border:2px solid #F76C9C"></i>今天</span>
        <span><i style="background:#FF8FB6;border-radius:99px"></i>产检日</span>
        <span>点击任意日期可写备注</span>
      </div>
    </section>

    <aside class="side">
      <div class="card">
        <div class="card-h"><h2>产检计划</h2><span class="tag" id="cuCount">—</span></div>
        <div class="cu-list" id="cuList"></div>
      </div>
      <div class="card">
        <div class="card-h"><h2>本周要点</h2></div>
        <div class="tips" id="tips"></div>
      </div>
    </aside>
  </div>

  <p class="foot">数据保存在本机浏览器（localStorage），刷新或关闭页面都不会丢失<br>本页仅供记录参考，产检安排以建档医院医嘱为准</p>
</div>

<button class="go-today" id="goTodayBtn" title="回到今天">📍 回到今天</button>
<div class="overlay" id="overlay">
  <div class="modal">
    <div class="modal-h" style="position:relative">
      <button class="close" id="closeBtn">✕</button>
      <h3 id="mTitle">—</h3>
      <p id="mSub">—</p>
    </div>
    <div class="modal-b">
      <div id="noteList"></div>
      <div class="add">
        <textarea id="noteInput" placeholder="记录今天的身体变化、心情、想吃的、要做的事…"></textarea>
        <div class="add-row">
          <select id="noteTag"><option>身体</option><option>心情</option><option>饮食</option><option>待办</option></select>
          <button class="btn" id="addBtn">添加备注</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
const DEFAULT_LMP = "2026-08-15";
const EDU = 280;
const WD = ["星期日","星期一","星期二","星期三","星期四","星期五","星期六"];

const CHECKUPS = [
  { day: 41,  name: "早孕检查 · HCG/孕酮/B超", short: "早孕检查", short: "早孕检查", stage: "t1", done: true, items: ["血 HCG（看翻倍）","孕酮（判断黄体支持是否需要）","B 超：确认宫内孕、孕囊、胎心胎芽","核对孕周与预产期","结果：HCG、孕酮、B 超均正常"] },
  { day: 56,  name: "建档 · 正式建卡", short: "建档",         short: "建档", stage: "t1", items: ["血常规、尿常规","肝肾功能 + 传染病四项","血型、甲功、心电图","妇科检查 + B 超声","建立母子健康手册"] },
  { day: 84,  name: "NT 超声 + 早期唐筛", short: "NT+唐筛",     stage: "t1", items: ["NT 颈项透明层超声（11–13+6 周）","早期唐氏筛查","血常规、尿常规","核对孕周、评估胎儿颈项"] },
  { day: 112, name: "中期唐筛 / 无创 DNA", short: "中期唐筛",    stage: "t1", items: ["中期血清学唐筛（15–20 周）","或无创 DNA（12–22 周）","血压体重、宫高腹围","贫血筛查"] },
  { day: 140, name: "常规产检 · 开始数胎动", short: "常规产检",   stage: "t2", items: ["孕程过半，注意胎动规律","血压、体重、宫高腹围","尿常规、水肿检查","预约大排畸超声"] },
  { day: 161, name: "大排畸 · 四维系统 B 超", short: "大排畸",  stage: "t2", items: ["系统超声筛查（22–24 周）","胎儿心脏 + 面部 + 骨骼","血常规复查","开始每日补钙 600–800mg"] },
  { day: 175, name: "糖耐量筛查 OGTT", short: "糖耐",         stage: "t2", items: ["75g 糖耐（空腹抽血 3 次，24–28 周）","前一天 22:00 后禁食","血常规、尿常规","贫血与血压复查"] },
  { day: 196, name: "产检 · 每 2 周一次", short: "产检",      stage: "t2", items: ["28–36 周每 2 周产检","血常规、尿常规（贫血复查）","Rh 阴性者复查抗体","开始数胎动并记录"] },
  { day: 210, name: "产检 · 每 2 周一次",      stage: "t3", items: ["体重、血压、宫高腹围","胎心 + 胎动评估","水肿与下肢静脉","准备待产包清单"] },
  { day: 224, name: "产检 + 胎心监护", short: "产检+胎监",         stage: "t3", items: ["胎心监护 NST 正式开始","血常规复查","B 族链球菌外的感染筛查","按医嘱复查超声"] },
  { day: 238, name: "产检 + 胎心监护",         stage: "t3", items: ["胎心监护 + 胎动","骨盆评估、胎位检查","确认分娩医院流程","待产包打包完成"] },
  { day: 252, name: "GBS 筛查 + 每周产检", short: "GBS筛查",     stage: "t3", items: ["B 族链球菌筛查（35–37 周）","胎心监护","白带常规","住院证件与费用准备"] },
  { day: 259, name: "每周产检 + 胎心监护", short: "每周产检",     stage: "t3", items: ["足月评估、宫颈成熟度","胎心监护、胎位与胎动","出现规律宫缩立即就医"] },
  { day: 266, name: "每周产检 + 胎心监护",     stage: "t3", items: ["超声评估羊水与胎盘","胎心监护","待产包放在门口随手可拿"] },
  { day: 273, name: "每周产检 + 胎心监护",     stage: "t3", items: ["胎心监护 + 内检评估","预产期临近，关注见红/破水"] },
  { day: 280, name: "预产期 · 每周产检", short: "预产期",       stage: "t3", items: ["预产期当天（EDD）","胎心监护 + 超声","过期妊娠需加强监护"] }
];

const TIPS = [
  "开始补充叶酸 400–800μg，预防神经管缺陷。",
  "可能出现孕吐、乳房胀痛、嗜睡，注意补水、少食多餐。",
  "尿频加重，睡前少喝水；避免剧烈运动与提重物。",
  "情绪波动大属正常，保证睡眠，可散步、听音乐。",
  "可能出现少量出血或腹痛，若持续加重需及时就诊。",
  "预约 NT 超声的最佳时间窗，别错过 11–13+6 周。",
  "NT 期间无需憋尿，注意胎儿颈项的配合姿势。",
  "唐筛结果通常 1–2 周出，无创 DNA 适用人群可与医生确认。",
  "孕吐高峰多半在此阶段，可少量多餐 + 维生素 B6。",
  "开始每日数胎动：早中晚各 1 小时是很好的习惯。",
  "进入孕中期，精力回升，食欲增强，注意均衡饮食。",
  "开始温和运动：孕妇瑜伽、散步、游泳都很好。",
  "孕程过半！可考虑无创 DNA 或羊膜腔穿刺时间窗。",
  "注意贫血，适量红肉、动物肝脏与维 C。",
  "预约大排畸超声，四维/系统超声的最佳时间。",
  "可能出现鼻塞、牙龈出血，属妊娠常见变化。",
  "开始每天补钙 600–800mg，牛奶 + 豆制品。",
  "留意胎动规律，异常时立即就医。",
  "大排畸结果出来后，与医生详细沟通后续安排。",
  "孕 20 周：开始规律数胎动，每天固定时间。",
  "可能出现腿抽筋，睡前拉伸小腿、补钙。",
  "注意血糖饮食，控制精制糖与主食总量。",
  "孕肚开始明显，弯腰起身要慢。",
  "糖耐前一晚 22:00 后禁食，别喝粥类。",
  "糖耐当天全程在院，空腹抽血 3 次共约 2 小时。",
  "注意胎动，如发现明显减少立即就诊。",
  "孕 28 周进入晚期产检阶段，每 2 周一次。",
  "开始数胎动并写进备注里，是最好的自我监测。",
  "待产包可以开始列清单了：证件、衣物、洗漱、宝宝用品。",
  "可能出现呼吸急促与尿频，属子宫增大所致。",
  "孕 32 周：胎心监护正式开始。",
  "注意水肿，少盐、抬高下肢、控制体重增速。",
  "开始了解分娩流程与无陪产政策。",
  "孕 36 周：GBS 筛查 + 每周产检，进入临产准备。",
  "足月了！规律宫缩、见红、破水任一出现即去医院。",
  "待产包放在门口，随身带证件与医保卡。",
  "每日数胎动：明显减少或剧烈频繁都要就诊。",
  "预产期到了！未发动也需按医嘱每周产检。",
  "超过预产期需加强监护，遵医嘱住院评估。",
  "已过预产期，按医生评估选择引产或继续等待。"
];

let LMP = localStorage.getItem("preg.lmp") || DEFAULT_LMP;
let notes = JSON.parse(localStorage.getItem("preg.notes.v1") || "{}");
let done = JSON.parse(localStorage.getItem("preg.done.v1") || "{}");
let view = { y: new Date().getFullYear(), m: new Date().getMonth() };
let selected = d2k(new Date());
let openCu = null;

function pad(n){ return String(n).padStart(2,"0") }
function d2k(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()) }
function k2d(k){ const p = k.split("-").map(Number); return new Date(p[0], p[1]-1, p[2]) }
function diffDays(a, b){ return Math.round((k2d(a) - k2d(b)) / 864e5) }
function today(){ return d2k(new Date()) }

function ga(key){
  const days = diffDays(key, LMP);
  const a = Math.abs(days);
  return { days, before: days < 0, w: Math.floor(a/7), d: a % 7, week: Math.floor(a/7) + 1 };
}
function stageOf(days){
  if (days < 0) return "pre";
  if (days >= EDU) return "post";
  if (days < 98) return "t1";
  if (days < 196) return "t2";
  return "t3";
}
function cuByDay(){
  const map = {};
  for (const c of CHECKUPS){ const k = d2k(new Date(k2d(LMP).getTime() + c.day * 864e5)); (map[k] = map[k] || []).push(c) }
  return map;
}

function fmtCN(key){
  const d = k2d(key);
  return d.getFullYear()+" 年 "+(d.getMonth()+1)+" 月 "+d.getDate()+" 日 "+WD[d.getDay()];
}
function fmtShort(key){
  const d = k2d(key);
  return (d.getMonth()+1)+"/"+d.getDate();
}
function gaText(g){
  if (g.before) return "孕前";
  return g.w+"周"+g.d+"天";
}
function save(){
  localStorage.setItem("preg.notes.v1", JSON.stringify(notes));
  localStorage.setItem("preg.done.v1", JSON.stringify(done));
  localStorage.setItem("preg.lmp", LMP);
}

function seedDefaults(){
  let changed = false;
  for (const c of CHECKUPS){
    if (!c.done) continue;
    const k = d2k(new Date(k2d(LMP).getTime() + c.day * 864e5));
    if (done[k] === undefined){ done[k] = true; changed = true }
    if (notes[k] === undefined){
      notes[k] = [{ tag: "身体", text: "第一次产检：HCG、孕酮、B 超都正常 💗", time: "已记录" }];
      changed = true;
    }
  }
  if (changed) save();
}

function renderHero(){
  const t = today();
  const g = ga(t);
  document.getElementById("lmpInput").value = LMP;
  if (g.before){
    document.getElementById("gaBig").innerHTML = "等待新生命开始";
    document.getElementById("gaSub").textContent = "末次月经 "+LMP+" · 还有 "+(-g.days)+" 天";
  } else {
    document.getElementById("gaBig").innerHTML = "孕 <em>"+g.w+"</em> 周 <em>"+g.d+"</em> 天";
    document.getElementById("gaSub").textContent = "第 "+g.week+" 周 · "+fmtCN(t);
  }
  const edd = d2k(new Date(k2d(LMP).getTime() + EDU * 864e5));
  const left = diffDays(edd, t);
  document.getElementById("stats").innerHTML =
    '<div class="stat"><b>'+g.week+'</b><span>当前第几周</span></div>' +
    '<div class="stat"><b>'+(left > 0 ? left : 0)+'</b><span>距预产期天数</span></div>' +
    '<div class="stat"><b>'+fmtShort(edd)+'</b><span>预产期 '+edd.slice(0,4)+'</span></div>';

  const pct = Math.min(100, Math.max(0, g.days / EDU * 100));
  const pin = document.getElementById("progPin");
  pin.style.left = pct + "%";
  pin.style.display = g.before ? "none" : "block";
  document.getElementById("progFill").style.width = pct + "%";
}

function renderCal(){
  const cuMap = cuByDay();
  const t = today();
  const first = new Date(view.y, view.m, 1);
  const offset = first.getDay();
  const daysInMonth = new Date(view.y, view.m + 1, 0).getDate();
  const prevDays = new Date(view.y, view.m, 0).getDate();
  let html = "";

  for (let i = offset - 1; i >= 0; i--){
    const d = new Date(view.y, view.m - 1, prevDays - i);
    html += '<div class="cell blank"></div>';
  }
  for (let i = 1; i <= daysInMonth; i++){
    const d = new Date(view.y, view.m, i);
    const k = d2k(d);
    const g = ga(k);
    const st = stageOf(g.days);
    const cls = ["cell", st === "pre" ? "pre" : st === "post" ? "post" : st];
    if (k === t) cls.push("today");
    if (k === selected) cls.push("sel");
    const weekStart = !g.before && g.days % 7 === 0;
    const wk = weekStart ? '<div class="wk">第'+g.week+'周</div>' : "";
    const notesN = (notes[k] || []).length;
    const dot = notesN ? '<div class="dot"></div>' : "";
    const cus = cuMap[k] || [];
    const cu = cus.length
      ? '<div class="cu '+cus[0].stage+'" title="'+esc(cus[0].name)+'">'+esc(cus[0].short || "产检")+'</div>'
      : "";
    const tip = !g.before && g.w < 40 ? (TIPS[g.w] || "") : "";
    html += '<div class="'+cls.join(" ")+'" data-k="'+k+'" title="'+esc(fmtCN(k)+" · 孕"+gaText(g)+(cus.length ? " · "+cus[0].name : "")+(tip ? "\n"+tip : ""))+'">'+
      wk + '<div class="d">'+i+'</div><div class="ga">'+(g.before ? "孕前" : g.w+"w"+g.d+"d")+'</div>' + cu + dot + '</div>';
  }
  const used = offset + daysInMonth;
  const tail = (7 - used % 7) % 7;
  for (let i = 0; i < tail; i++) html += '<div class="cell blank"></div>';

  document.getElementById("calBody").innerHTML = html;
  const gEnd = ga(d2k(new Date(view.y, view.m, daysInMonth)));
  document.getElementById("calTitle").innerHTML = view.y+" 年 "+(view.m+1)+" 月<small>孕 "+(ga(d2k(new Date(view.y, view.m, 1))).before ? "—" : ga(d2k(new Date(view.y, view.m, 1))).w+" 周")+" – "+(gEnd.before ? "—" : gEnd.w+" 周")+"</small>";
}

function esc(s){
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

function renderCu(){
  const t = today();
  const rows = CHECKUPS.map((c, idx) => {
    const k = d2k(new Date(k2d(LMP).getTime() + c.day * 864e5));
    const dd = diffDays(k, t);
    const past = dd < 0;
    const isDone = !!done[k];
    const isNext = !isDone && !past && CHECKUPS.findIndex(x => diffDays(d2k(new Date(k2d(LMP).getTime() + x.day*864e5)), t) >= 0) === idx;
    let flag = "";
    if (isDone) flag = '<span class="cu-flag">已完成</span>';
    else if (past) flag = '<span class="cu-flag soon">待补做</span>';
    else if (isNext) flag = '<span class="cu-flag next">下次产检</span>';
    return '<div class="cu-item'+(isDone ? " done" : "")+(past ? " past" : "")+(openCu === idx ? " open" : "")+'" data-i="'+idx+'" data-k="'+k+'">'+
      '<div class="cu-box'+(isDone ? " on" : "")+'" data-toggle="'+idx+'"></div>'+
      '<div class="cu-main">'+
        '<div class="cu-name"><span class="badge-week">'+(c.day/7|0)+"w+"+(c.day%7)+"d"+'</span>' + esc(c.name) + flag + '</div>'+
        '<div class="cu-date">'+fmtCN(k) + (isDone ? "" : (past ? " · 已过 " + (-dd) + " 天" : (dd === 0 ? " · 就是今天" : " · 还有 " + dd + " 天"))) + '</div>'+
        '<ul class="cu-items" style="list-style:none">' + c.items.map(x => '<li style="font-size:11.5px;color:var(--soft);line-height:1.75">· '+esc(x)+'</li>').join("") + '</ul>'+
      '</div></div>';
  });
  document.getElementById("cuList").innerHTML = rows.join("");
  const doneN = CHECKUPS.filter(c => done[d2k(new Date(k2d(LMP).getTime() + c.day*864e5))]).length;
  document.getElementById("cuCount").textContent = doneN + " / " + CHECKUPS.length + " 次已完成";
}

function renderTips(){
  const g = ga(selected);
  const idx = Math.min(39, Math.max(0, g.w));
  const stage = g.days < 98 ? "孕早期" : g.days < 196 ? "孕中期" : "孕晚期";
  const stg = g.days < 98 ? "t1" : g.days < 196 ? "t2" : "t3";
  let nextHtml = "";
  const t = today();
  const next = CHECKUPS.find(c => diffDays(d2k(new Date(k2d(LMP).getTime() + c.day*864e5)), t) >= 0 && !done[d2k(new Date(k2d(LMP).getTime() + c.day*864e5))]);
  if (next){
    const nk = d2k(new Date(k2d(LMP).getTime() + next.day*864e5));
    const dd = diffDays(nk, t);
    nextHtml = '<div class="next-up"><b>下次产检 · '+esc(next.name)+'</b><span>'+fmtCN(nk)+' · '+(dd === 0 ? "就是今天" : "还有 "+dd+" 天")+'</span></div>';
  }
  document.getElementById("tips").innerHTML =
    '<h3><span>'+(g.before ? "孕前" : stage)+'</span>'+(g.before ? "尚未开始" : "第 "+g.week+" 周 · "+gaText(g))+'</h3>'+
    '<p>所选日期：'+fmtCN(selected)+'</p>'+
    '<ul>' + (g.before ? "<li>调整作息、补充叶酸，迎接好消息。</li>" : "<li>"+esc(TIPS[idx] || "平稳度过每一天，记得按时产检。")+"</li>") + "</ul>" + nextHtml;
}

function renderNotes(){
  const list = notes[selected] || [];
  document.getElementById("noteList").innerHTML = list.length
    ? list.map((n, i) => '<div class="note"><span class="tagchip '+esc(n.tag)+'">'+esc(n.tag)+'</span><div class="note-t">'+esc(n.text)+'<small>'+esc(n.time)+'</small></div><button class="note-del" data-del="'+i+'">✕</button></div>').join("")
    : '<div class="empty">还没有备注，写下今天的感受吧 🌷</div>';
}

function openModal(k){
  selected = k;
  const g = ga(k);
  document.getElementById("mTitle").textContent = fmtCN(k);
  document.getElementById("mSub").textContent = (g.before ? "孕前 · 备孕期" : "孕 " + gaText(g) + " · 第 " + g.week + " 周");
  renderNotes();
  document.getElementById("overlay").classList.add("on");
  setTimeout(() => document.getElementById("noteInput").focus(), 60);
}
function closeModal(){ document.getElementById("overlay").classList.remove("on") }

function renderAll(){
  renderHero();
  renderCal();
  renderCu();
  renderTips();
}

document.getElementById("calBody").addEventListener("click", e => {
  const cell = e.target.closest(".cell[data-k]");
  if (!cell || cell.classList.contains("blank")) return;
  openModal(cell.dataset.k);
});
document.getElementById("cuList").addEventListener("click", e => {
  const tg = e.target.closest("[data-toggle]");
  const item = e.target.closest(".cu-item");
  if (!item) return;
  if (tg){
    const k = item.dataset.k;
    done[k] = !done[k];
    save();
    renderCu();
    e.stopPropagation();
    return;
  }
  openCu = openCu === Number(item.dataset.i) ? null : Number(item.dataset.i);
  renderCu();
});
document.getElementById("addBtn").addEventListener("click", () => {
  const el = document.getElementById("noteInput");
  const text = el.value.trim();
  if (!text) return;
  const d = new Date();
  const stamp = (d.getMonth()+1)+"月"+d.getDate()+"日 "+pad(d.getHours())+":"+pad(d.getMinutes());
  (notes[selected] = notes[selected] || []).push({ tag: document.getElementById("noteTag").value, text, time: stamp });
  el.value = "";
  save();
  renderNotes();
  renderCal();
});
document.getElementById("noteInput").addEventListener("keydown", e => {
  if ((e.ctrlKey || e.metaKey) && e.key === "Enter") document.getElementById("addBtn").click();
});
document.getElementById("noteList").addEventListener("click", e => {
  const b = e.target.closest("[data-del]");
  if (!b) return;
  notes[selected].splice(Number(b.dataset.del), 1);
  if (!notes[selected].length) delete notes[selected];
  save();
  renderNotes();
  renderCal();
});
document.getElementById("closeBtn").addEventListener("click", closeModal);
document.getElementById("overlay").addEventListener("click", e => { if (e.target.id === "overlay") closeModal() });
document.addEventListener("keydown", e => { if (e.key === "Escape") closeModal() });

document.getElementById("prevBtn").addEventListener("click", () => { view.m--; if (view.m < 0){ view.m = 11; view.y-- } renderCal() });
document.getElementById("nextBtn").addEventListener("click", () => { view.m++; if (view.m > 11){ view.m = 0; view.y++ } renderCal() });
document.getElementById("todayBtn").addEventListener("click", goToday);
document.getElementById("lmpInput").addEventListener("change", e => {
  if (!e.target.value) { e.target.value = LMP; return }
  LMP = e.target.value;
  seedDefaults();
  renderAll();
});
document.getElementById("goTodayBtn").addEventListener("click", goToday);

function goToday(){
  const n = new Date();
  view = { y: n.getFullYear(), m: n.getMonth() };
  selected = today();
  renderAll();
  document.getElementById("todayBtn").classList.add("pulse");
  setTimeout(() => document.getElementById("todayBtn").classList.remove("pulse"), 1200);
  window.scrollTo({ top: 0, behavior: "smooth" });
}

seedDefaults();
renderAll();
</script>
